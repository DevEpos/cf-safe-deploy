# CI
#
# Trigger: push to `main` and pull requests targeting `main`.
# Purpose: run the project's build and test suite across the supported
#          Node.js matrix (18, 20, 22) plus a Prettier formatting check.
# Security posture: read-only checkout, no secrets used, minimal
#          `contents: read` permission.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7 # v7.0.0
      - uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build
      - run: npm test
